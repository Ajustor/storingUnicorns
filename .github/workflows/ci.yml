name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The release builds on these same three runners.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libssl-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libglib2.0-dev \
            libxkbcommon-x11-dev libwayland-dev

      - name: cargo test
        run: cargo test

      - name: cargo build
        run: cargo build

      # Same check as the release build (see scripts/check-linked-libs.sh).
      - name: Check linked libraries
        if: matrix.os != 'windows-latest'
        run: bash scripts/check-linked-libs.sh target/debug/storingUnicorns
