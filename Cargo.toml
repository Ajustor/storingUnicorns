[package]
name = "storingUnicorns"
version = "0.8.7"
edition = "2021"
description = "A terminal-based database client inspired by DataGrip"
license = "MIT"

[[bin]]
name = "storingUnicorns"

[dependencies]
# GUI
eframe = { version = "0.31", features = ["default"] }
egui = "0.31"
egui_extras = "0.31"
egui-phosphor = "0.9"
rfd = "0.15"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database connectors
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "postgres",
  "mysql",
  "sqlite",
  "rust_decimal",
  "chrono",
  "uuid",
  "json",
] }

# Stream combinators (to drain sqlx `fetch_many` streams)
futures-util = "0.3"

# SQL Server connector
tiberius = { version = "0.12", default-features = false, features = [
  "tds73",
  "rustls",
  "rust_decimal",
  "chrono",
] }

# Decimal support
rust_decimal = "1"
tokio-util = { version = "0.7", features = ["compat"] }

# Date/time support
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization (for config/saved connections)
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
dirs = "5.0"

# SQL formatting (GUI "Reformat")
sqlformat = "0.3"

# Terminal effects
tachyonfx = "0.9"

# Azure AD authentication
azure_identity = "0.22"
azure_core = "0.22"

# Self-update from GitHub Pages
ureq = "3"
semver = "1"
sha2 = "0.10"
self-replace = "1"
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
